name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Matter/mDNS build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev libavahi-client-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Test bridge
        run: cargo test --manifest-path bridge/Cargo.toml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test custom component helpers
        run: |
          pip install pytest
          pytest custom_components/thatsmatter/tests -q
