configuration:
  bridge_name:
    name: Bridge name
    description: Name shown for the Matter bridge node and diagnostics
  listen_port:
    name: Listen port
    description: HTTP control plane port for the ThatsMatter integration (default 18465)
  matter_backend:
    name: Matter backend
    description: "rs_matter = commissionable Matter stack; dev = offline IPC only"
  log_level:
    name: Log level
    description: Logging verbosity for the bridge process
  mdns_interface:
    name: LAN interface
    description: >-
      Interface the Matter stack reports/requires as operational (e.g. eth0,
      enp1s0, wlan0). Needs IPv6 on that face (link-local is enough). Empty =
      auto-select best non-virtual IPv6 LAN face (skips Docker/hassio). Does not
      pin Avahi multi-homing — configure Avahi separately if needed. Wrong name
      fails start.
network:
  18465/TCP: ThatsMatter integration control plane (HTTP JSON)
