[package]
name = "thatsmatter-bridge"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "ThatsMatter Matter bridge process"
license = "MIT"
publish = false

[[bin]]
name = "thatsmatter-bridge"
path = "src/main.rs"

[lib]
name = "thatsmatter_bridge"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-io = "2"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
edge-nal-std = "0.7"
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
futures-lite = "2"
parking_lot = "0.12"
rand = "0.8"
rs-matter = { version = "0.2", default-features = false, features = ["os", "log", "zeroconf", "rustcrypto"] }
# `max-subscriptions-8`: the default of 3 is exhausted by HA + a second ecosystem + a debug tool.
rs-matter-stack = { version = "0.1", default-features = false, features = [
  "os",
  "log",
  "zeroconf",
  "rustcrypto",
  "max-subscriptions-8",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
